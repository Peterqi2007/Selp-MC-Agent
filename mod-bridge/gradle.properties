# ---- Gradle / JVM -----------------------------------------------------------
# The JDK used to run Gradle. Java 25 (C:/Users/<you>/.jdks/openjdk-25.0.1) is
# too new for Fabric Loom's Gradle version, so we pin the Java 21 runtime that
# ships with the Minecraft launcher. Forward slashes are required: in a
# .properties file a backslash is an escape character.
org.gradle.java.home=C:/Users/<you>/AppData/Local/Packages/Microsoft.4297127D64EC6_8wekyb3d8bbwe/LocalCache/Local/runtime/java-runtime-delta/windows-x64/java-runtime-delta
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# ---- Fabric toolchain -------------------------------------------------------
loom_version=1.11.8
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.12+1.20.1

# ---- Mod --------------------------------------------------------------------
mod_version=1.0.0
maven_group=dev.agentbridge
archives_base_name=agent-bridge
