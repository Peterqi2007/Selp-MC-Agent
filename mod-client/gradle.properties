# ---- Gradle / JVM -----------------------------------------------------------
# The JDK used to run Gradle. Java 25 is too new for ForgeGradle 6, so we pin the
# Java 21 runtime that ships with the Minecraft launcher. Forward slashes are
# required: in a .properties file a backslash is an escape character.
org.gradle.java.home=C:/Users/<you>/AppData/Local/Packages/Microsoft.4297127D64EC6_8wekyb3d8bbwe/LocalCache/Local/runtime/java-runtime-delta/windows-x64/java-runtime-delta
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true

# ---- Forge toolchain --------------------------------------------------------
# 1.20.1 is a Java 17 target; ForgeGradle 6 + Forge 47.4.x is the matching pair.
forge_version=1.20.1-47.4.10
minecraft_version=1.20.1
mappings_channel=official
mappings_version=1.20.1

# ---- Mod --------------------------------------------------------------------
mod_version=1.0.0
maven_group=dev.agentclient
archives_base_name=agent-client
